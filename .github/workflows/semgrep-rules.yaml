name: semgrep-rules
on: [push, pull_request]

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pipx install semgrep
      - run: semgrep --validate --config flask-command-injection-shell.yaml
      - run: semgrep --test --config flask-command-injection-shell.yaml flask-command-injection-shell.py
