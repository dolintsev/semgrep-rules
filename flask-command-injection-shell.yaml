rules:
  - id: flask-command-injection-shell
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Данные пользователя попадают в команду оболочки. Передавай команду списком
      без shell=True: subprocess.run(["dig", domain]).
    metadata:
      category: security
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A05:2025 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    pattern-sources:
      - pattern: flask.request.$ANYTHING
    pattern-sanitizers:
      - pattern: shlex.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
          - focus-metavariable: $CMD
